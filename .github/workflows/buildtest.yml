# This workflow builds svSlicer. The C++ version is built on Ubuntu and macOS.
name: Buildtest
on: [push, pull_request]
jobs:
  build-ubuntu:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Install ubuntu dependencies
        run: sudo apt update && sudo apt install -y build-essential cmake libgl1-mesa-dev libvtk9-dev qtbase5-dev
      - name: Build svSlicer
        run: |
          mkdir Release
          cd Release
          cmake -DCMAKE_BUILD_TYPE=Release ..
          cmake --build .
  build-macos:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-13, macos-14]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Install macOS dependencies
        run: brew install vtk libomp
      - name: Build svSlicer
        run: |
          mkdir Release
          cd Release
          cmake -DCMAKE_BUILD_TYPE=Release ..
          cmake --build .
