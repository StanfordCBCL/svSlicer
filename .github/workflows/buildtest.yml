# This workflow builds svSlicer. The C++ version is built on Ubuntu and macOS.
name: Buildtest
on: [push, pull_request]
jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ubuntu dependencies
        run: sudo apt update && sudo apt install -y build-essential cmake libgl1-mesa-dev libvtk9-dev qtbase5-dev
      - name: Build svSlicer
        run: |
          mkdir Release
          cd Release
          cmake -DCMAKE_BUILD_TYPE=Release ..
          cmake --build .
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install macOS dependencies
        run: brew install vtk libomp
      - name: Build svSlicer
        run: |
          mkdir Release
          cd Release
          cmake -DCMAKE_BUILD_TYPE=Release ..
          cmake --build .
